name: Temporary Penjualan patch

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Penjualan form update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Penjualan only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          replacements = [
          ("  const [saleDate, setSaleDate] = useState(todayLocal())\n", "  const [saleDate, setSaleDate] = useState(todayLocal())\n  const [saleBrand, setSaleBrand] = useState('')\n  const [saleBrandOpen, setSaleBrandOpen] = useState(false)\n"),
          ("const rupiah = (v: number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v)\n", "const rupiah = (v: number) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v)\nconst formatRupiahInput = (v: string) => { const digits = v.replace(/\\D/g, ''); return digits ? Number(digits).toLocaleString('id-ID') : '0' }\nconst parseRupiahInput = (v: string) => Number(v.replace(/\\./g, '').replace(/\\D/g, '') || 0)\n"),
          ("    const price = Number(salePrice)\n    if (!product) { setNotice('Pilih barang yang akan dijual.'); return }\n", "    const price = parseRupiahInput(salePrice)\n    const brand = saleBrand.trim()\n    if (!product) { setNotice('Pilih barang yang akan dijual.'); return }\n"),
          ("    if (!Number.isFinite(price) || price < 0) { setNotice('Harga jual tidak boleh negatif.'); return }\n    if (!saleDate) { setNotice('Tanggal penjualan wajib diisi.'); return }\n", "    if (!Number.isFinite(price) || price < 0) { setNotice('Harga jual tidak boleh negatif.'); return }\n    if (!brand) { setNotice('Brand wajib diisi.'); return }\n    if (!saleDate) { setNotice('Tanggal penjualan wajib diisi.'); return }\n"),
          ("body: JSON.stringify({ p_barang_id: product.id, p_brand: product.brand || 'Tanpa brand', p_qty: qty, p_harga: price, p_tanggal_pembelian: saleDate })", "body: JSON.stringify({ p_barang_id: product.id, p_brand: brand, p_qty: qty, p_harga: price, p_tanggal_pembelian: saleDate })"),
          ("      setSaleQty('1')\n      setNotice('Penjualan tersimpan.", "      setSaleQty('1')\n      setSalePrice('0')\n      setSaleBrand('')\n      setSaleBrandOpen(false)\n      setNotice('Penjualan tersimpan."),
          ("  const incomingSearchResults = useMemo(() => {", "  const saleBrandResults = useMemo(() => {\n    const q = saleBrand.trim().toLowerCase()\n    return brands.filter(b => !q || b.nama.toLowerCase().includes(q)).slice(0, 8)\n  }, [brands, saleBrand])\n  const incomingSearchResults = useMemo(() => {"),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Missing expected source block: ' + old[:80])
              if s.count(old) != 1:
                  raise SystemExit('Source block is not unique: ' + old[:80])
              s = s.replace(old,new,1)
          old = '''                <label className="sales-field sales-field-product"><span>Barang yang dijual</span>\n                  <select value={saleProductId} onChange={e => { const id = e.target.value; setSaleProductId(id); const item = products.find(p => p.id === Number(id)); if (item) setSalePrice(String(item.price)) }}>\n                    <option value="">Pilih nama barang</option>{products.map(p => <option key={p.id} value={p.id}>{p.name} · {p.brand}</option>)}\n                  </select>\n                  <small>Pilih barang dari daftar stok.</small>\n                </label>'''
          new = '''                <label className="sales-field sales-field-product"><span>Barang yang dijual</span>\n                  <select value={saleProductId} onChange={e => { const id = e.target.value; setSaleProductId(id); const item = products.find(p => p.id === Number(id)); if (item) { setSalePrice(formatRupiahInput(String(item.price))); setSaleBrand(item.brand === 'Tanpa brand' ? '' : item.brand) } }}>\n                    <option value="">Pilih nama barang</option>{products.map(p => <option key={p.id} value={p.id}>{p.name} · {p.brand}</option>)}\n                  </select>\n                  <small>Pilih barang dari daftar stok.</small>\n                </label>\n                <label className="sales-field sales-field-brand"><span>Brand</span>\n                  <div style={{ position: 'relative' }}>\n                    <input value={saleBrand} placeholder="Ketik nama brand" onFocus={() => setSaleBrandOpen(true)} onChange={e => { setSaleBrand(e.target.value); setSaleBrandOpen(true) }} onBlur={() => window.setTimeout(() => setSaleBrandOpen(false), 150)} autoComplete="off" />\n                    {saleBrandOpen && saleBrandResults.length > 0 && <div style={{ position: 'absolute', zIndex: 20, top: 'calc(100% + 4px)', left: 0, right: 0, maxHeight: 180, overflowY: 'auto', border: '1px solid #e1e8dc', borderRadius: 9, background: '#fff', boxShadow: '0 8px 20px rgba(20,30,20,.10)' }}>\n                      {saleBrandResults.map(brand => <button key={brand.id} type="button" onMouseDown={e => e.preventDefault()} onClick={() => { setSaleBrand(brand.nama); setSaleBrandOpen(false) }} style={{ display: 'block', width: '100%', padding: '9px 11px', border: 0, borderBottom: '1px solid #eef2eb', background: '#fff', textAlign: 'left', fontSize: 12, color: '#344238' }}>{brand.nama}</button>)}\n                    </div>}\n                  </div>\n                </label>'''
          if s.count(old) != 1:
              raise SystemExit('Product sales JSX block not found or not unique')
          s = s.replace(old,new,1)
          old = '''                <label className="sales-field"><span>Jumlah terjual</span>\n                  <div className="sales-input-wrap"><input type="number" min="1" step="1" inputMode="numeric" value={saleQty} onChange={e => setSaleQty(e.target.value)} /><small>unit</small></div>\n                </label>'''
          new = '''                <label className="sales-field"><span>Quantity</span>\n                  <div className="sales-input-wrap" style={{ display: 'grid', gridTemplateColumns: '36px minmax(0,1fr) 36px', alignItems: 'center', overflow: 'hidden' }}>\n                    <button type="button" aria-label="Kurangi quantity" onClick={() => setSaleQty(String(Math.max(1, (Number(saleQty) || 1) - 1)))} style={{ height: 39, border: 0, background: '#f1f5ed', color: '#526f52', fontSize: 20, lineHeight: 1 }}>−</button>\n                    <input type="number" min="1" step="1" inputMode="numeric" value={saleQty} onChange={e => setSaleQty(e.target.value)} style={{ width: '100%', border: 0, textAlign: 'center', padding: '0 4px', height: 39 }} />\n                    <button type="button" aria-label="Tambah quantity" onClick={() => setSaleQty(String((Number(saleQty) || 1) + 1))} style={{ height: 39, border: 0, background: '#f1f5ed', color: '#526f52', fontSize: 20, lineHeight: 1 }}>+</button>\n                  </div>\n                </label>'''
          if s.count(old) != 1:
              raise SystemExit('Quantity JSX block not found or not unique')
          s = s.replace(old,new,1)
          old = '''                <label className="sales-field"><span>Harga jual per unit</span>\n                  <div className="sales-input-wrap sales-price-input"><small>Rp</small><input type="number" min="0" step="100" inputMode="numeric" value={salePrice} onChange={e => setSalePrice(e.target.value)} /></div>\n                  <small>Harga dapat disesuaikan untuk transaksi ini.</small>\n                </label>'''
          new = '''                <label className="sales-field"><span>Harga</span>\n                  <div className="sales-input-wrap sales-price-input"><small>Rp</small><input type="text" inputMode="numeric" value={salePrice} onChange={e => setSalePrice(formatRupiahInput(e.target.value))} /></div>\n                  <small>Contoh: 1.000.000</small>\n                </label>'''
          if s.count(old) != 1:
              raise SystemExit('Price JSX block not found or not unique')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Apply Penjualan form update'
          git push
          gh workflow run deploy.yml --ref main
          git rm .github/workflows/temp-sales-patch.yml
          git commit -m 'Remove temporary Penjualan patch workflow'
          git push