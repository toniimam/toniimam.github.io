name: Temporary Penjualan Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Penjualan filter build') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          replacements = [
            ("  const [saleBrand, setSaleBrand] = useState('')\n", ""),
            ("  const [saleBrandOpen, setSaleBrandOpen] = useState(false)\n", ""),
            ("    const brand = product.brand === 'Tanpa brand' ? '' : product.brand\n    if (!product) { setNotice('Pilih barang yang akan dijual.'); return }", "    if (!product) { setNotice('Pilih barang yang akan dijual.'); return }\n    const brand = product.brand === 'Tanpa brand' ? '' : product.brand"),
            ("      setSaleBrand('')\n      setSaleBrandOpen(false)\n", ""),
            ("  const saleBrandResults = useMemo(() => {\n    const q = saleBrand.trim().toLowerCase()\n    return brands.filter(b => !q || b.nama.toLowerCase().includes(q)).slice(0, 8)\n  }, [brands, saleBrand])\n\n", ""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-penjualan-fix.yml
          git add src/App.tsx
          git commit -m "Fix Penjualan filter build"
          git push