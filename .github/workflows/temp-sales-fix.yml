name: Temp Penjualan fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Penjualan only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          s=s.replace("  <small>Contoh: 1.000.000</small>","")
          s=s.replace('className="sales-field"><span>Tanggal penjualan</span>','className="sales-field sales-field-date"><span>Tanggal penjualan</span>',1)
          s=s.replace('className="sales-field sales-field-price"><span>Harga</span>','className="sales-field sales-field-price"><span>Harga</span>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || git commit -m 'Polish Penjualan price and date alignment'
          git push
          git rm .github/workflows/temp-sales-fix.yml
          git commit -m 'Remove temporary Penjualan fix workflow'
          git push
