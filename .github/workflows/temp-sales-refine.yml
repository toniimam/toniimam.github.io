name: Temp Penjualan refine
on:
  push:
    paths:
      - '.github/workflows/temp-sales-refine.yml'
      - 'src/App.tsx'
      - 'src/app.css'
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Penjualan refinements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Penjualan fields
        run: |
          echo '--- Stock / forecast context ---'
          grep -n -E -C 3 'Stok|Perkiraan' src/App.tsx | head -120 || true
      - name: Patch Penjualan only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.tsx')
          s = p.read_text()
          original = s

          old = "  const [saleProductId, setSaleProductId] = useState('')\n  const [saleQty, setSaleQty] = useState('1')"
          new = "  const [saleProductId, setSaleProductId] = useState('')\n  const [saleProductSearch, setSaleProductSearch] = useState('')\n  const [saleQty, setSaleQty] = useState('1')"
          if old not in s: raise SystemExit('State anchor not found')
          s = s.replace(old, new, 1)

          anchor = "  const saleBrandResults = useMemo(() => {\n    const q = saleBrand.trim().toLowerCase()\n    return brands.filter(b => !q || b.nama.toLowerCase().includes(q)).slice(0, 8)\n  }, [brands, saleBrand])"
          addition = anchor + "\n\n  const saleProductResults = useMemo(() => {\n    const q = saleProductSearch.trim().toLowerCase()\n    return products.filter(p => !q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q)).slice(0, 10)\n  }, [products, saleProductSearch])"
          if anchor not in s: raise SystemExit('Brand results anchor not found')
          s = s.replace(anchor, addition, 1)

          pattern = re.compile(r'<label className="sales-field[^>]*">(?:(?!</label>).)*?saleProductId(?:(?!</label>).)*?</label>', re.S)
          matches = pattern.findall(s)
          if len(matches) != 1: raise SystemExit(f'Product field match count={len(matches)}')
          old_label = matches[0]
          new_label = '''<label className="sales-field sales-field-product"><span>Barang</span>
            <div style={{ position: 'relative' }}>
              <input
                value={saleProductSearch}
                placeholder="Cari nama barang / SKU / brand"
                onChange={e => { setSaleProductSearch(e.target.value); setSaleProductId('') }}
                autoComplete="off"
              />
              {saleProductSearch.trim() && saleProductResults.length > 0 && <div className="sales-product-results">
                {saleProductResults.map(product => <button key={product.id} type="button" onMouseDown={e => e.preventDefault()} onClick={() => {
                  setSaleProductId(String(product.id))
                  setSaleProductSearch(product.name)
                  setSalePrice(formatRupiahInput(String(product.price)))
                  setSaleBrand(product.brand === 'Tanpa brand' ? '' : product.brand)
                }}>
                  <span>{product.name}</span><small>{product.sku} · {product.brand}</small>
                </button>)}
              </div>}
            </div>
          </label>'''
          s = s.replace(old_label, new_label, 1)

          old = "      setSalePrice('0')\n      setSaleBrand('')"
          new = "      setSalePrice('0')\n      setSaleProductSearch('')\n      setSaleBrand('')"
          if old not in s: raise SystemExit('Sale reset anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace('<label className="sales-field"><span>Harga</span>', '<label className="sales-field sales-field-price"><span>Harga</span>', 1)
          s = s.replace('  <small>Contoh: 1.000.000</small>\n</label>', '</label>', 1)

          old = "const parseRupiahInput = (v: string) => Number(v.replace(/\\./g, '').replace(/\\D/g, '') || 0)"
          new = "const parseRupiahInput = (v: string) => { const digits = String(v).replace(/\\D/g, ''); return digits ? Number(digits) : 0 }"
          if old in s: s = s.replace(old, new, 1)

          # Align the two Penjualan summary values without touching other pages.
          s = s.replace('<div className="sales-stock-card">', '<div className="sales-stock-card sales-stock-pair">', 1)
          s = s.replace('<div className="sales-estimate-card">', '<div className="sales-estimate-card sales-stock-pair">', 1)

          p.write_text(s)

          css = Path('src/app.css')
          c = css.read_text()
          marker = '/* TEMP_SALES_REFINEMENT */'
          if marker not in c:
              c += '''\n\n/* TEMP_SALES_REFINEMENT */\n.sales-field-price{min-width:0}\n.sales-field-price .sales-input-wrap{width:100%;min-width:0;height:38px}\n.sales-field-price .sales-input-wrap input{min-width:0}\n.sales-page input[type="date"]{width:100%;min-width:0;height:38px}\n.sales-product-results{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:230px;overflow:auto;background:#fff;border:1px solid #e5e8f0;border-radius:8px;box-shadow:0 8px 20px rgba(24,33,59,.10);padding:4px}\n.sales-product-results button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;border-radius:6px;background:#fff;padding:8px 9px;text-align:left;color:#354056}\n.sales-product-results button:hover{background:#f1f5ed}\n.sales-product-results button span{font-size:10px;font-weight:700}\n.sales-product-results button small{font-size:8px;color:#9098aa}\n.sales-field-price small{display:none}\n.sales-stock-pair{flex:1;min-width:0}\n@media(max-width:700px){.sales-page input[type="date"],.sales-field-price .sales-input-wrap{height:36px}.sales-product-results{max-height:190px}.sales-stock-pair{min-width:0}}\n'''
              css.write_text(c)

          if s == original: raise SystemExit('No App.tsx changes made')
          PY
      - name: Commit and trigger deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/app.css .github/workflows/temp-sales-refine.yml
          git commit -m 'Apply Penjualan refinements'
          git push
