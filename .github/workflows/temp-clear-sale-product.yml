name: Temp clear sale product

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Add clear button to Penjualan barang') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''    <input
      value={saleProductSearch}
      placeholder="Cari nama barang / SKU / brand"
      onChange={e => { setSaleProductSearch(e.target.value); setSaleProductId('') }}
      autoComplete="off"
    />'''
          new = '''    <div style={{ position: 'relative' }}>
      <input
        value={saleProductSearch}
        placeholder="Cari nama barang / SKU / brand"
        onChange={e => { setSaleProductSearch(e.target.value); setSaleProductId('') }}
        autoComplete="off"
        style={{ paddingRight: saleProductSearch ? 38 : undefined }}
      />
      {saleProductSearch && <button
        type="button"
        aria-label="Hapus barang"
        title="Hapus barang"
        onClick={() => { setSaleProductSearch(''); setSaleProductId(''); setSalePrice('0') }}
        style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', width: 28, height: 28, display: 'grid', placeItems: 'center', border: 0, borderRadius: 7, background: 'transparent', color: '#7b8495', cursor: 'pointer' }}
      ><X size={16} /></button>}
    </div>'''
          if old not in s:
              raise SystemExit('Target input Barang tidak ditemukan, patch dibatalkan.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/temp-clear-sale-product.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/temp-clear-sale-product.yml
          git commit -m "Add clear button to Penjualan barang"
          git push
