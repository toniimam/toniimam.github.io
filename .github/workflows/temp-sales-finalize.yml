name: Temp Penjualan finalize
on:
  push:
    paths:
      - '.github/workflows/temp-sales-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize Penjualan refinements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Penjualan only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = "{rupiah(Math.max(0, Number(saleQty) || 0) * Math.max(0, Number(salePrice) || 0))}"
          new = "{rupiah(Math.max(0, Number(saleQty) || 0) * Math.max(0, parseRupiahInput(salePrice)))}"
          if old not in s:
              raise SystemExit('Sales total anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          css = Path('src/app.css')
          c = css.read_text()
          extra = '''\n.sales-page .sales-form-bottom{align-items:stretch}\n.sales-page .sales-stock-info,.sales-page .sales-total{flex:1;min-width:0;min-height:64px;display:flex;flex-direction:column;justify-content:center}\n.sales-page .sales-stock-info>span,.sales-page .sales-total>span{min-height:18px}\n'''
          if '.sales-page .sales-form-bottom{align-items:stretch}' not in c:
              c += extra
          css.write_text(c)
          PY
          git rm .github/workflows/temp-sales-refine.yml .github/workflows/temp-sales-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/app.css
          git commit -m 'Finalize Penjualan refinements'
          git push
