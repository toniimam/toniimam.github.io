<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="StokFlow, dashboard pengelolaan stok barang." />
    <title>StokFlow | Manajemen Stok</title>
    <style>
      .sales-page .sales-field-date{position:relative}
      .sales-page .sales-field-date>input[type="date"]{color:transparent;position:relative;z-index:1}
      .sales-page .sales-field-date>input[type="date"]::-webkit-datetime-edit{color:transparent}
      .sales-page .sales-field-date>input[type="date"]::-webkit-calendar-picker-indicator{opacity:1}
      .sales-page .sales-field-date>.sales-date-display{position:absolute;left:11px;right:38px;bottom:0;height:41px;margin:0;display:flex;align-items:center;pointer-events:none;z-index:2;font-size:11px;line-height:1;font-weight:600;color:#65745f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      /* Navbar benar-benar fixed terhadap viewport, tidak ikut bergeser saat scroll */
      .topbar{position:fixed!important;top:0!important;left:246px!important;right:0!important;height:69px!important;z-index:100!important}
      .desktop-nav{position:fixed!important;top:69px!important;left:246px!important;right:0!important;z-index:99!important;width:auto!important}
      .main-area{padding-top:116px!important}
      @media(max-width:850px){
        .topbar{position:fixed!important;top:0!important;left:0!important;right:0!important;height:69px!important;z-index:100!important}
        .desktop-nav{display:none!important}
        .main-area{padding-top:69px!important}
      }

      /* Perbaikan selector tanggal Barang Masuk, native input tetap aktif */
      .incoming-page .incoming-field-date{position:relative!important;min-width:0!important}
      .incoming-page .incoming-date-control{position:relative!important;display:block!important;width:100%!important;height:40px!important;min-height:40px!important}
      .incoming-page .incoming-date-control input[type="date"]{
        position:absolute!important;inset:0!important;width:100%!important;height:40px!important;min-height:40px!important;margin:0!important;padding:0 10px!important;box-sizing:border-box!important;
        color:transparent!important;font-size:12px!important;line-height:normal!important;z-index:1!important;
      }
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-fields-wrapper,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-text,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-month-field,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-day-field,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-year-field{color:transparent!important}
      .incoming-page .incoming-date-control input[type="date"]::-webkit-calendar-picker-indicator{opacity:1!important;position:absolute!important;right:7px!important;top:50%!important;transform:translateY(-50%)!important;z-index:4!important;margin:0!important;padding:5px!important}
      .incoming-page .incoming-date-overlay{
        position:absolute!important;left:11px!important;right:50px!important;top:0!important;height:40px!important;margin:0!important;display:flex!important;align-items:center!important;pointer-events:none!important;z-index:2!important;
        overflow:hidden!important;white-space:nowrap!important;text-overflow:ellipsis!important;color:#354056!important;font:500 12px/1 'DM Sans',sans-serif!important
      }
      .incoming-page .incoming-field-date>.sales-date-display{display:none!important}
      @media(max-width:600px){
        .incoming-page .incoming-date-control{height:39px!important;min-height:39px!important}
        .incoming-page .incoming-date-control input[type="date"]{height:39px!important;min-height:39px!important}
        .incoming-page .incoming-date-overlay{height:39px!important;font-size:12px!important;right:50px!important}
      }
    </style>
    <script>
      (function () {
        function showLoadError(message) {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var panel = document.getElementById('stokflow-load-error');
          if (!panel) {
            panel = document.createElement('div');
            panel.id = 'stokflow-load-error';
            panel.style.cssText = 'font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:40px auto;padding:24px;color:#172033;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 30px #00000010';
            document.body.appendChild(panel);
          }
          panel.replaceChildren();
          var heading = document.createElement('h2');
          heading.textContent = 'StokFlow gagal dimuat';
          heading.style.cssText = 'margin:0 0 10px;font-size:22px';
          var detail = document.createElement('p');
          detail.textContent = message || 'JavaScript tidak berhasil menjalankan aplikasi.';
          detail.style.cssText = 'overflow-wrap:anywhere;color:#475569';
          var help = document.createElement('p');
          help.textContent = 'Coba muat ulang halaman. Jika pesan ini muncul lagi, kirimkan detail di atas agar masalahnya bisa diperbaiki.';
          panel.append(heading, detail, help);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target !== window) {
            var target = event.target;
            if (target.tagName === 'SCRIPT' || target.tagName === 'LINK') {
              showLoadError('Aset gagal dimuat: ' + (target.src || target.href || target.tagName));
              return;
            }
          }
          showLoadError(event.message || 'Terjadi kesalahan JavaScript.');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showLoadError('Kesalahan JavaScript: ' + (reason && reason.message ? reason.message : String(reason || 'Promise ditolak')));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showLoadError('Halaman terbuka, tetapi aplikasi belum tampil setelah 12 detik. Kemungkinan file JavaScript gagal dimuat atau terjadi kesalahan saat aplikasi dimulai.');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StokFlow membutuhkan JavaScript agar dapat berjalan. Aktifkan JavaScript pada browser Anda.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
