<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="StokFlow, dashboard pengelolaan stok barang." />
    <title>StokFlow | Manajemen Stok</title>
    <style>
      .sales-page .sales-field-date{position:relative}
      .sales-page .sales-field-date>input[type="date"]{color:transparent;position:relative;z-index:1}
      .sales-page .sales-field-date>input[type="date"]::-webkit-datetime-edit{color:transparent}
      .sales-page .sales-field-date>input[type="date"]::-webkit-calendar-picker-indicator{opacity:1}
      .sales-page .sales-field-date>.sales-date-display{position:absolute;left:11px;right:38px;bottom:0;height:41px;margin:0;display:flex;align-items:center;pointer-events:none;z-index:2;font-size:11px;line-height:1;font-weight:600;color:#65745f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

      .topbar{position:fixed!important;top:0!important;left:246px!important;right:0!important;height:69px!important;z-index:100!important}
      .desktop-nav{position:fixed!important;top:69px!important;left:246px!important;right:0!important;z-index:99!important;width:auto!important}
      .main-area{padding-top:116px!important}
      @media(max-width:850px){
        .topbar{position:fixed!important;top:0!important;left:0!important;right:0!important;height:69px!important;z-index:100!important}
        .desktop-nav{display:none!important}
        .main-area{padding-top:69px!important}
      }

      .incoming-page .incoming-field-date{position:relative!important;min-width:0!important}
      .incoming-page .incoming-date-control{position:relative!important;display:block!important;width:100%!important;height:40px!important;min-height:40px!important}
      .incoming-page .incoming-date-control input[type="date"]{position:absolute!important;inset:0!important;width:100%!important;height:40px!important;min-height:40px!important;margin:0!important;padding:0 10px!important;box-sizing:border-box!important;color:transparent!important;font-size:12px!important;line-height:normal!important;z-index:1!important}
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-fields-wrapper,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-text,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-month-field,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-day-field,
      .incoming-page .incoming-date-control input[type="date"]::-webkit-datetime-edit-year-field{color:transparent!important}
      .incoming-page .incoming-date-control input[type="date"]::-webkit-calendar-picker-indicator{opacity:1!important;position:absolute!important;right:7px!important;top:50%!important;transform:translateY(-50%)!important;z-index:4!important;margin:0!important;padding:5px!important}
      .incoming-page .incoming-date-overlay{position:absolute!important;left:11px!important;right:50px!important;top:0!important;height:40px!important;margin:0!important;display:flex!important;align-items:center!important;pointer-events:none!important;z-index:2!important;overflow:hidden!important;white-space:nowrap!important;text-overflow:ellipsis!important;color:#354056!important;font:500 12px/1 'DM Sans',sans-serif!important}
      .incoming-page .incoming-field-date>.sales-date-display{display:none!important}

      /* Form koreksi stok, ringkas dan proporsional */
      .correction-form-card{padding:14px!important}
      .correction-form-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(90px,.75fr) minmax(135px,1fr);gap:10px;align-items:start}
      .correction-form-grid .sales-field{min-width:0!important;margin:0!important}
      .correction-form-grid .sales-field>span{display:block;margin-bottom:6px;font-size:11px;font-weight:600}
      .correction-form-grid .sales-field>input,.correction-search-wrap>input{width:100%;height:39px;min-width:0;box-sizing:border-box;padding:0 10px;border:1px solid #dfe5da;border-radius:9px;background:#fff;font:500 12px 'DM Sans',sans-serif;color:#354056}
      .correction-search-wrap{position:relative;min-width:0}
      .correction-search-wrap>input{padding-right:32px}
      .correction-search-wrap>button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#7b8495;font-size:20px;line-height:1}
      .correction-search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;max-height:220px;overflow:auto;background:#fff;border:1px solid #dfe5da;border-radius:9px;box-shadow:0 8px 24px #1c2b1c16}
      .correction-search-results>button{display:flex;width:100%;flex-direction:column;gap:3px;text-align:left;padding:9px 10px;border:0;border-bottom:1px solid #edf0e9;background:#fff;color:#354056;font-size:12px}
      .correction-search-results>button span,.correction-search-empty{font-size:10px;color:#7b8495}
      .correction-search-empty{padding:10px}
      .correction-form-bottom{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
      .correction-form-bottom .sales-stock-info{min-width:0;flex:1}
      .correction-form-bottom .sales-stock-info span{font-size:10px}
      .correction-form-bottom .sales-stock-info strong{font-size:13px}
      .correction-form-bottom .sales-submit{margin-left:auto;white-space:nowrap}
      .correction-hint{display:block;margin-top:8px;font-size:10px;color:#7b8495}
      @media(max-width:600px){
        .correction-form-card{padding:11px!important}
        .correction-form-grid{grid-template-columns:minmax(0,1fr) 94px;gap:9px}
        .correction-product-field{grid-column:1 / -1}
        .correction-date-field{min-width:0}
        .correction-form-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
        .correction-form-bottom .sales-stock-info{padding:8px 9px;background:#f7f9f4;border-radius:8px}
        .correction-form-bottom .sales-submit{grid-column:1 / -1;width:100%;margin:0;min-height:39px}
        .correction-hint{line-height:1.4}
      }

      /* Tabel riwayat koreksi, ringkas dan konsisten dengan riwayat barang masuk */
      .correction-history-table{width:100%!important;overflow:hidden!important}
      .correction-history-table table{width:100%!important;min-width:0!important;table-layout:fixed!important}
      .correction-history-table th,.correction-history-table td{box-sizing:border-box!important;vertical-align:middle!important}
      .correction-history-table th:nth-child(1),.correction-history-table td:nth-child(1){width:90px!important}
      .correction-history-table th:nth-child(2),.correction-history-table td:nth-child(2){width:auto!important}
      .correction-history-table th:nth-child(3),.correction-history-table td:nth-child(3){width:112px!important}
      .correction-history-table th:nth-child(4),.correction-history-table td:nth-child(4){width:104px!important;text-align:right!important}
      .correction-history-table td:nth-child(2){white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.35!important}
      .correction-history-table th{height:36px!important;padding:9px 10px!important}
      .correction-history-table td{height:44px!important;padding:9px 10px!important}
      .correction-history-table th:first-child,.correction-history-table td:first-child{padding-left:16px!important}
      .correction-history-table th:last-child,.correction-history-table td:last-child{padding-right:14px!important}
      .correction-history-table td:nth-child(4){font-weight:600!important;color:#515b70!important}
      @media(max-width:600px){
        .correction-history-table{overflow:hidden!important}
        .correction-history-table th:nth-child(1),.correction-history-table td:nth-child(1){width:76px!important}
        .correction-history-table th:nth-child(3),.correction-history-table td:nth-child(3){width:94px!important}
        .correction-history-table th:nth-child(4),.correction-history-table td:nth-child(4){width:84px!important}
        .correction-history-table th,.correction-history-table td{padding-left:7px!important;padding-right:7px!important}
        .correction-history-table th:first-child,.correction-history-table td:first-child{padding-left:12px!important}
        .correction-history-table th:last-child,.correction-history-table td:last-child{padding-right:10px!important}
      }

      /* Tabel riwayat barang masuk, minimalis dan tidak melebar */
      .incoming-history-table{width:100%!important;overflow:hidden!important}
      .incoming-history-table table{width:100%!important;min-width:0!important;table-layout:fixed!important}
      .incoming-history-table th,.incoming-history-table td{box-sizing:border-box!important;vertical-align:middle!important}
      .incoming-history-table th:nth-child(1),.incoming-history-table td:nth-child(1){width:90px!important}
      .incoming-history-table th:nth-child(2),.incoming-history-table td:nth-child(2){width:auto!important}
      .incoming-history-table th:nth-child(3),.incoming-history-table td:nth-child(3){width:105px!important;text-align:right!important}
      .incoming-history-table th:nth-child(4),.incoming-history-table td:nth-child(4){width:110px!important;text-align:right!important}
      .incoming-history-table td:nth-child(2){white-space:normal!important;overflow-wrap:anywhere!important;line-height:1.35!important}
      .incoming-history-table th{height:36px!important;padding:9px 10px!important}
      .incoming-history-table td{height:44px!important;padding:9px 10px!important}
      .incoming-history-table th:first-child,.incoming-history-table td:first-child{padding-left:16px!important}
      .incoming-history-table th:last-child,.incoming-history-table td:last-child{padding-right:14px!important}
      .incoming-history-table td:nth-child(3),.incoming-history-table td:nth-child(4){font-weight:600!important;color:#515b70!important}
      @media(max-width:600px){
        .incoming-page .incoming-date-control{height:39px!important;min-height:39px!important}
        .incoming-page .incoming-date-control input[type="date"]{height:39px!important;min-height:39px!important}
        .incoming-page .incoming-date-overlay{height:39px!important;font-size:12px!important;right:50px!important}
        .incoming-history-table{overflow:hidden!important}
        .incoming-history-table th:nth-child(1),.incoming-history-table td:nth-child(1){width:76px!important}
        .incoming-history-table th:nth-child(3),.incoming-history-table td:nth-child(3){width:82px!important}
        .incoming-history-table th:nth-child(4),.incoming-history-table td:nth-child(4){width:88px!important}
        .incoming-history-table th,.incoming-history-table td{padding-left:7px!important;padding-right:7px!important}
        .incoming-history-table th:first-child,.incoming-history-table td:first-child{padding-left:12px!important}
        .incoming-history-table th:last-child,.incoming-history-table td:last-child{padding-right:10px!important}
      }
    </style>
    <script>
      (function () {
        function showLoadError(message) {
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var panel = document.getElementById('stokflow-load-error');
          if (!panel) {
            panel = document.createElement('div');
            panel.id = 'stokflow-load-error';
            panel.style.cssText = 'font:16px/1.5 system-ui,sans-serif;max-width:680px;margin:40px auto;padding:24px;color:#172033;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 8px 30px #00000010';
            document.body.appendChild(panel);
          }
          panel.replaceChildren();
          var heading = document.createElement('h2');
          heading.textContent = 'StokFlow gagal dimuat';
          heading.style.cssText = 'margin:0 0 10px;font-size:22px';
          var detail = document.createElement('p');
          detail.textContent = message || 'JavaScript tidak berhasil menjalankan aplikasi.';
          detail.style.cssText = 'overflow-wrap:anywhere;color:#475569';
          var help = document.createElement('p');
          help.textContent = 'Coba muat ulang halaman. Jika pesan ini muncul lagi, kirimkan detail di atas agar masalahnya bisa diperbaiki.';
          panel.append(heading, detail, help);
        }
        window.addEventListener('error', function (event) {
          if (event.target && event.target !== window) {
            var target = event.target;
            if (target.tagName === 'SCRIPT' || target.tagName === 'LINK') {
              showLoadError('Aset gagal dimuat: ' + (target.src || target.href || target.tagName));
              return;
            }
          }
          showLoadError(event.message || 'Terjadi kesalahan JavaScript.');
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showLoadError('Kesalahan JavaScript: ' + (reason && reason.message ? reason.message : String(reason || 'Promise ditolak')));
        });
        window.setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            showLoadError('Halaman terbuka, tetapi aplikasi belum tampil setelah 12 detik. Kemungkinan file JavaScript gagal dimuat atau terjadi kesalahan saat aplikasi dimulai.');
          }
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>StokFlow membutuhkan JavaScript agar dapat berjalan. Aktifkan JavaScript pada browser Anda.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
